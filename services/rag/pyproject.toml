[project]
name = "legal-platform-rag"
version = "0.0.0"
description = "RAG engine — retrieval + grounded generation over verified Indian legal sources (Phase 4)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.8.4", "mypy>=1.14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
