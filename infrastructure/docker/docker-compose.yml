# legal-platform — local development stack.
#
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#     -> postgres + redis + api          (default)
#   docker compose ... --profile web up -d
#     -> also builds & runs web + advocate-portal
#
# Env is read from the repo-root .env (see .env.example). Run from the repo root
# or pass --project-directory . so relative build contexts resolve.

name: legal-platform

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-console}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-legal_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal} -d ${POSTGRES_DB:-legal_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-legal}:${POSTGRES_PASSWORD:-legal_dev_password}@postgres:5432/${POSTGRES_DB:-legal_platform}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-legal}:${POSTGRES_PASSWORD:-legal_dev_password}@postgres:5432/${POSTGRES_DB:-legal_platform}
      REDIS_URL: redis://redis:6379/0
      API_SECRET_KEY: ${API_SECRET_KEY:-change-me-dev-only}
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../../apps/api:/app
      - api-venv:/opt/venv
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
      NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  advocate-portal:
    profiles: ["web"]
    build:
      context: ../..
      dockerfile: apps/advocate-portal/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
      NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}
    ports:
      - "${ADVOCATE_PORTAL_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  api-venv:
