name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  js:
    name: web · packages (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_APP_ENV: production

  # ---------------------------------------------------------------------------
  api:
    name: api (ruff · mypy · pytest · migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legal -d legal_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: development
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://legal:legal@localhost:5432/legal_platform_test
      DATABASE_URL_SYNC: postgresql+psycopg://legal:legal@localhost:5432/legal_platform_test
      REDIS_URL: redis://localhost:6379/0
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: alembic check (no un-migrated model changes)
        run: uv run alembic check

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  # ---------------------------------------------------------------------------
  docker:
    name: docker builds
    runs-on: ubuntu-latest
    needs: [js, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (runtime)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build advocate-portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/advocate-portal/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
